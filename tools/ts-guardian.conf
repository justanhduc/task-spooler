# TS Guardian — 监控指定用户，发现运行超过阈值的非系统程序并冻结
#
# "系统程序" = 可执行文件属主为 root (UID 0)
# "非系统程序" = 可执行文件属主非 root
#
# 格式:
#   USER <username>        — 要监控的用户名（可多次出现）
#   RUNTIME_HOURS <n>      — 运行时间阈值（小时），默认 100
#   LOG_DIR <path>         — 日志输出目录，默认 /var/log/ts-guardian
#   TS_BIN <path>          — ts 可执行文件路径，留空则用 PATH 中的 ts

USER kylin
USER john

RUNTIME_HOURS 100

LOG_DIR /var/log/ts-guardian

# TS_BIN /usr/local/bin/ts
